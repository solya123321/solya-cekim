<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Solya Çekim">
<meta name="robots" content="noindex">
<title>Solya Çekim</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
:root {
  --kirmizi: #D82929;
  --komur: #111114;
  --kirik: #F7F7F5;
  --sonuk: #62626A;
  --cizgi: #DCDCD6;
  --ust: env(safe-area-inset-top, 0px);
  --alt: env(safe-area-inset-bottom, 0px);
  font-family: "Barlow Semi Condensed", -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { height: 100%; margin: 0; background: var(--komur); }
body { overflow: hidden; overscroll-behavior: none; }
button, textarea { font: inherit; color: inherit; }
button { border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--kirmizi); outline-offset: 2px; }
[hidden] { display: none !important; }

.ekran { position: fixed; inset: 0; display: flex; flex-direction: column; }

/* Metin ekranı: kâğıt gibi, yalnız yazı ve tek düğme */
#metinEkrani { background: var(--kirik); color: var(--komur); padding: calc(var(--ust) + 10px) 0 calc(var(--alt) + 14px); }
#liste { display: flex; gap: 6px; overflow-x: auto; padding: 4px 18px 10px; scrollbar-width: none; flex: none; }
#liste::-webkit-scrollbar { display: none; }
#liste button {
  flex: none; max-width: 170px; min-height: 40px; padding: 0 14px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 18px; font-weight: 600; color: var(--sonuk);
  border-bottom: 3px solid var(--cizgi);
}
#liste button[aria-current="true"] { color: var(--komur); border-bottom-color: var(--kirmizi); }
#yazi {
  flex: 1; min-height: 0; width: 100%; padding: 12px 18px; border: 0; outline: 0; resize: none;
  background: transparent; font-size: 26px; font-weight: 500; line-height: 1.32;
}
#yazi::placeholder { color: #9A9AA0; }
#bilgi { display: flex; justify-content: space-between; align-items: center; padding: 8px 18px; font-size: 19px; color: var(--sonuk); flex: none; }
#sil { font-size: 18px; font-weight: 600; color: var(--komur); min-height: 40px; padding: 0 0 0 16px; }
#gec {
  flex: none; margin: 0 14px; min-height: 64px; border-radius: 32px;
  background: var(--kirmizi); color: #fff; font-size: 25px; font-weight: 700;
}
#gec:disabled { background: var(--cizgi); color: #85858C; }

/* Çekim ekranı */
#cekimEkrani { background: #000; color: #fff; }
#onizleme { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); } /* kırpma yok: ekranda görünen kadraj kaydedilen kadrajdır */

/* Okuma bandı: ön kameranın hemen altında, göz lense yakın kalsın diye */
#okuma {
  position: absolute; left: 0; right: 0; top: 0; height: 50%;
  background: linear-gradient(to bottom, rgba(0,0,0,.34) 72%, rgba(0,0,0,0));
}
#cekimEkrani.kayitta #okuma { background: linear-gradient(to bottom, rgba(0,0,0,.84) 72%, rgba(0,0,0,0)); }
#kaydirici {
  position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none; padding: 0 22px 0 30px;
  -webkit-mask-image: linear-gradient(to bottom, transparent calc(var(--ust) + 4px), #000 calc(var(--ust) + 40px), #000 58%, rgba(0,0,0,.28) 92%, transparent);
          mask-image: linear-gradient(to bottom, transparent calc(var(--ust) + 4px), #000 calc(var(--ust) + 40px), #000 58%, rgba(0,0,0,.28) 92%, transparent);
}
#kaydirici::-webkit-scrollbar { display: none; }
#akanYazi { margin: 0; font-weight: 600; line-height: 1.2; white-space: pre-wrap; overflow-wrap: anywhere; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
#isaret {
  position: absolute; left: 0; width: 14px; height: 1.2em;
  background: var(--kirmizi); border-radius: 0 7px 7px 0; pointer-events: none;
}
#durdu {
  position: absolute; right: 14px; bottom: 26%; padding: 6px 14px; border-radius: 20px;
  background: var(--kirmizi); font-size: 20px; font-weight: 700; pointer-events: none;
}

#geriSay {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-size: 180px; font-weight: 700; color: #fff; text-shadow: 0 3px 24px rgba(0,0,0,.7);
}

#kumanda {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 44px 14px calc(var(--alt) + 14px);
  background: linear-gradient(to top, rgba(0,0,0,.72) 55%, rgba(0,0,0,0));
}
#ayarlar { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.ayar { display: flex; align-items: center; background: rgba(17,17,20,.72); border-radius: 26px; }
.ayar button { width: 52px; height: 52px; font-size: 30px; font-weight: 600; }
.ayar output { min-width: 66px; text-align: center; font-size: 19px; line-height: 1.05; font-weight: 600; }
.ayar small { display: block; font-size: 14px; font-weight: 500; opacity: .8; }

#altSira { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
#geri { grid-column: 1; justify-self: start; min-height: 52px; padding: 0 8px; font-size: 21px; font-weight: 600; }
#kayit {
  grid-column: 2; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center;
  border: 4px solid #fff; background: transparent;
}
#kayit span { display: block; width: 62px; height: 62px; border-radius: 50%; background: var(--kirmizi); transition: all .16s; }
#kayit[aria-pressed="true"] span { width: 34px; height: 34px; border-radius: 7px; }
#sure { grid-column: 3; justify-self: end; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
#sure small { display: block; font-size: 15px; font-weight: 500; opacity: .8; }

#uyari {
  position: absolute; left: 14px; right: 14px; top: 42%; padding: 16px 18px; border-radius: 14px;
  background: var(--kirik); color: var(--komur); font-size: 21px; line-height: 1.3;
}

/* İnceleme ekranı */
#incelemeEkrani { background: var(--komur); color: #fff; padding: calc(var(--ust) + 10px) 14px calc(var(--alt) + 14px); gap: 10px; }
#izle { flex: 1; min-height: 0; width: 100%; background: #000; border-radius: 12px; object-fit: contain; }
#kaydet { min-height: 64px; border-radius: 32px; background: var(--kirmizi); color: #fff; font-size: 25px; font-weight: 700; }
#ipucu { margin: 0; min-height: 24px; text-align: center; font-size: 19px; color: #C9C9CE; }
#incelemeAlt { display: flex; justify-content: space-between; }
#incelemeAlt button { min-height: 48px; padding: 0 6px; font-size: 21px; font-weight: 600; }

@media (prefers-reduced-motion: reduce) { #kayit span { transition: none; } }
</style>
</head>
<body>

<section id="metinEkrani" class="ekran">
  <nav id="liste" aria-label="Kayıtlı metinler"></nav>
  <textarea id="yazi" aria-label="Okunacak metin" placeholder="Okuyacağınız metni buraya yapıştırın"></textarea>
  <div id="bilgi"><span id="tahmin"></span><button id="sil" type="button">Metni sil</button></div>
  <button id="gec" type="button">Çekime geç</button>
</section>

<section id="cekimEkrani" class="ekran" hidden>
  <video id="onizleme" autoplay muted playsinline></video>
  <div id="okuma">
    <div id="kaydirici"><p id="akanYazi"></p></div>
    <div id="isaret" aria-hidden="true"></div>
    <div id="durdu" hidden>Durdu</div>
  </div>
  <div id="geriSay" aria-live="assertive" hidden></div>
  <div id="kumanda">
    <div id="ayarlar">
      <div class="ayar" role="group" aria-label="Kayma hızı">
        <button id="hizAz" type="button" aria-label="Yavaşlat">−</button>
        <output id="hizDeger"></output>
        <button id="hizCok" type="button" aria-label="Hızlandır">+</button>
      </div>
      <div class="ayar" role="group" aria-label="Yazı boyu">
        <button id="yaziAz" type="button" aria-label="Yazıyı küçült">−</button>
        <output id="yaziDeger"></output>
        <button id="yaziCok" type="button" aria-label="Yazıyı büyüt">+</button>
      </div>
    </div>
    <div id="altSira">
      <button id="geri" type="button">Metne dön</button>
      <button id="kayit" type="button" aria-label="Kaydı başlat" aria-pressed="false"><span></span></button>
      <div id="sure"></div>
    </div>
  </div>
  <div id="uyari" role="alert" hidden></div>
</section>

<section id="incelemeEkrani" class="ekran" hidden>
  <video id="izle" controls playsinline></video>
  <button id="kaydet" type="button">Videoyu kaydet</button>
  <p id="ipucu" role="status"></p>
  <div id="incelemeAlt">
    <button id="tekrar" type="button">Yeniden çek</button>
    <button id="metneDon" type="button">Metne dön</button>
  </div>
</section>

<script>
'use strict';

const $ = (id) => document.getElementById(id);
const DEPO = 'solya-cekim';
const HIZ = { en: 90, cok: 240, adim: 10 };
const YAZI = { en: 28, cok: 84, adim: 4 };
const OKUMA_ORANI = 0.3; // okuma satırının bant içindeki yüksekliği
const BITRATE = 10_000_000;

let durum = yukle();
let akim = null;
let kaydedici = null;
let parcalar = [];
let kilit = null;
let cekiliyor = false;
let akiyor = false;
let oncekiKare = 0;
let birikim = 0;
let baslangic = 0;
let saatKimligi = 0;
let videoAdresi = null;
let videoDosya = null;
let kaydedildi = true;

function yukle() {
  const bos = { metinler: [{ id: Date.now(), metin: '' }], aktif: null, hiz: 140, yazi: 48 };
  const ham = localStorage.getItem(DEPO);
  if (!ham) { bos.aktif = bos.metinler[0].id; return bos; }
  const d = { ...bos, ...JSON.parse(ham) };
  if (!d.metinler.some((m) => m.id === d.aktif)) d.aktif = d.metinler[0].id;
  return d;
}

function sakla() {
  localStorage.setItem(DEPO, JSON.stringify(durum));
}

const aktif = () => durum.metinler.find((m) => m.id === durum.aktif);
const kelimeSayisi = (s) => s.trim().split(/\s+/).filter(Boolean).length;

function sureYazisi(sn) {
  const s = Math.max(1, Math.round(sn));
  if (s < 60) return `yaklaşık ${s} saniye`;
  const kalan = s % 60;
  return `yaklaşık ${Math.floor(s / 60)} dk${kalan ? ` ${kalan} sn` : ''}`;
}

/* Metin ekranı */

function listeyiCiz() {
  const nav = $('liste');
  nav.textContent = '';
  for (const m of durum.metinler) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = m.metin.trim().slice(0, 28) || 'Yeni metin';
    b.setAttribute('aria-current', String(m.id === durum.aktif));
    b.onclick = () => { durum.aktif = m.id; sakla(); metniGoster(); };
    nav.append(b);
  }
  const yeni = document.createElement('button');
  yeni.type = 'button';
  yeni.textContent = '+ Yeni';
  yeni.onclick = () => {
    const id = Date.now();
    durum.metinler.push({ id, metin: '' });
    durum.aktif = id;
    sakla();
    metniGoster();
    $('yazi').focus();
  };
  nav.append(yeni);
}

function ozetYaz() {
  const metin = aktif().metin;
  const k = kelimeSayisi(metin);
  $('tahmin').textContent = k ? `${k} kelime, ${sureYazisi((k / durum.hiz) * 60)}` : 'Önce metni yapıştırın';
  $('gec').disabled = k === 0;
}

function metniGoster() {
  $('yazi').value = aktif().metin;
  listeyiCiz();
  ozetYaz();
}

$('yazi').addEventListener('input', (o) => {
  aktif().metin = o.target.value;
  sakla();
  ozetYaz();
  listeyiCiz();
});

$('sil').onclick = () => {
  if (aktif().metin.trim() && !confirm('Bu metin silinsin mi?')) return;
  durum.metinler = durum.metinler.filter((m) => m.id !== durum.aktif);
  if (!durum.metinler.length) durum.metinler.push({ id: Date.now(), metin: '' });
  durum.aktif = durum.metinler[durum.metinler.length - 1].id;
  sakla();
  metniGoster();
};

/* Kamera */

async function akimIste(genislik, yukseklik) {
  return navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: genislik }, height: { ideal: yukseklik }, frameRate: { ideal: 30 } },
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true },
  });
}

const kisaKenar = (s) => {
  const a = s.getVideoTracks()[0].getSettings();
  return Math.min(a.width || 0, a.height || 0);
};

// Telefonlar dikey tutulunca genişlik/yüksekliği farklı yorumluyor: biri düşük kalırsa diğeri denenir
async function kameraAc() {
  if (!navigator.mediaDevices?.getUserMedia) {
    throw new Error('Bu tarayıcı kamerayı açamıyor. Sayfayı Safari ya da Chrome ile https adresinden açın.');
  }
  if (typeof MediaRecorder === 'undefined') {
    throw new Error('Bu tarayıcı video kaydedemiyor. Safari ya da Chrome\'un güncel sürümünü kullanın.');
  }
  let s = await akimIste(1920, 1080);
  if (kisaKenar(s) < 1000) {
    const ikinci = await akimIste(1080, 1920);
    if (kisaKenar(ikinci) > kisaKenar(s)) {
      s.getTracks().forEach((t) => t.stop());
      s = ikinci;
    } else {
      ikinci.getTracks().forEach((t) => t.stop());
    }
  }
  akim = s;
  $('onizleme').srcObject = s;
  await $('onizleme').play();
}

function kameraKapat() {
  akim?.getTracks().forEach((t) => t.stop());
  akim = null;
  $('onizleme').srcObject = null;
}

function kameraHatasi(h) {
  if (h.name === 'NotAllowedError') {
    return 'Kamera ve mikrofon izni kapalı. Tarayıcı ayarlarından bu siteye izin verin, sonra sayfayı yenileyin.';
  }
  if (h.name === 'NotFoundError') return 'Kamera ya da mikrofon bulunamadı.';
  if (h.name === 'NotReadableError') return 'Kamerayı başka bir uygulama kullanıyor. Onu kapatıp yeniden deneyin.';
  return h.message || 'Kamera açılamadı.';
}

async function ekranAcikKalsin() {
  if (!('wakeLock' in navigator) || kilit) return;
  try {
    kilit = await navigator.wakeLock.request('screen');
    kilit.addEventListener('release', () => { kilit = null; });
  } catch {
    uyar('Ekran kendiliğinden kapanabilir. Telefon ayarlarından otomatik kilidi kapatın.', 5000);
  }
}

let uyariSaati = 0;
function uyar(metin, sure = 0) {
  clearTimeout(uyariSaati);
  $('uyari').textContent = metin;
  $('uyari').hidden = false;
  if (sure) uyariSaati = setTimeout(() => { $('uyari').hidden = true; }, sure);
}

/* Çekim ekranı */

function ekranGoster(id) {
  for (const e of ['metinEkrani', 'cekimEkrani', 'incelemeEkrani']) $(e).hidden = e !== id;
}

function ayarlariCiz() {
  $('hizDeger').innerHTML = `${durum.hiz}<small>kelime/dk</small>`;
  $('yaziDeger').innerHTML = `${durum.yazi}<small>yazı boyu</small>`;
  $('akanYazi').style.fontSize = `${durum.yazi}px`;
  yerlesimiKur();
}

function yerlesimiKur() {
  const k = $('kaydirici');
  const satir = durum.yazi * 1.2;
  const y = k.clientHeight * OKUMA_ORANI;
  k.style.paddingTop = `${y}px`;
  k.style.paddingBottom = `${k.clientHeight - y - satir}px`;
  $('isaret').style.top = `${y}px`;
  $('isaret').style.fontSize = `${durum.yazi}px`;
}

function pikselHizi() {
  const k = $('kaydirici');
  const yol = k.scrollHeight - k.clientHeight;
  const sn = (kelimeSayisi(aktif().metin) / durum.hiz) * 60;
  return sn > 0 ? yol / sn : 0;
}

function kare(t) {
  if (!cekiliyor) return;
  const dt = Math.min((t - oncekiKare) / 1000, 0.1);
  oncekiKare = t;
  if (akiyor) {
    birikim += pikselHizi() * dt;
    const adim = Math.floor(birikim);
    if (adim > 0) {
      $('kaydirici').scrollTop += adim;
      birikim -= adim;
    }
  }
  requestAnimationFrame(kare);
}

function akisiAyarla(acik) {
  akiyor = acik;
  $('durdu').hidden = acik || !cekiliyor;
}

$('okuma').addEventListener('click', () => {
  if (cekiliyor) akisiAyarla(!akiyor);
});

function degistir(alan, sinir, yon) {
  const k = $('kaydirici');
  const yol = k.scrollHeight - k.clientHeight;
  const oran = yol > 0 ? k.scrollTop / yol : 0;
  durum[alan] = Math.min(sinir.cok, Math.max(sinir.en, durum[alan] + yon * sinir.adim));
  sakla();
  ayarlariCiz();
  k.scrollTop = oran * (k.scrollHeight - k.clientHeight);
}
$('hizAz').onclick = () => degistir('hiz', HIZ, -1);
$('hizCok').onclick = () => degistir('hiz', HIZ, 1);
$('yaziAz').onclick = () => degistir('yazi', YAZI, -1);
$('yaziCok').onclick = () => degistir('yazi', YAZI, 1);

function hazirBilgisi() {
  const a = akim?.getVideoTracks()[0].getSettings();
  $('sure').innerHTML = a ? `<small>${a.width}×${a.height}</small>` : '';
}

$('gec').onclick = async () => {
  $('uyari').hidden = true;
  ekranGoster('cekimEkrani');
  $('akanYazi').textContent = aktif().metin.trim();
  $('kaydirici').scrollTop = 0;
  ayarlariCiz();
  try {
    await kameraAc();
    hazirBilgisi();
    await ekranAcikKalsin();
  } catch (h) {
    uyar(kameraHatasi(h));
  }
};

function metneDon() {
  kameraKapat();
  kilit?.release();
  ekranGoster('metinEkrani');
  metniGoster();
}
$('geri').onclick = metneDon;

function bicimSec() {
  const adaylar = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
  return adaylar.find((b) => MediaRecorder.isTypeSupported(b)) || '';
}

const bekle = (ms) => new Promise((c) => setTimeout(c, ms));

async function geriSay() {
  const g = $('geriSay');
  g.hidden = false;
  for (const n of [3, 2, 1]) {
    g.textContent = n;
    await bekle(900);
  }
  g.hidden = true;
}

function saatiYaz() {
  const sn = Math.floor((Date.now() - baslangic) / 1000);
  $('sure').textContent = `${String(Math.floor(sn / 60)).padStart(2, '0')}:${String(sn % 60).padStart(2, '0')}`;
}

async function kaydiBaslat() {
  $('kayit').disabled = true;
  $('geri').hidden = true;
  $('cekimEkrani').classList.add('kayitta');
  $('kaydirici').scrollTop = 0;
  await geriSay();

  parcalar = [];
  const bicim = bicimSec();
  kaydedici = new MediaRecorder(akim, { mimeType: bicim || undefined, videoBitsPerSecond: BITRATE, audioBitsPerSecond: 192_000 });
  kaydedici.ondataavailable = (o) => { if (o.data.size) parcalar.push(o.data); };
  kaydedici.onstop = kayitBitti;
  kaydedici.start(1000); // Parçasız kayıtta iPhone Safari görüntüyü 15 sn civarı dondurur (WebKit hata 315091)

  cekiliyor = true;
  baslangic = Date.now();
  saatiYaz();
  saatKimligi = setInterval(saatiYaz, 500);
  $('kayit').disabled = false;
  $('kayit').setAttribute('aria-pressed', 'true');
  $('kayit').setAttribute('aria-label', 'Kaydı bitir');

  oncekiKare = performance.now();
  birikim = 0;
  requestAnimationFrame(kare);
  await bekle(700); // ilk kelimeden önce nefes payı
  if (cekiliyor) akisiAyarla(true);
}

function kaydiBitir() {
  cekiliyor = false;
  akisiAyarla(false);
  $('durdu').hidden = true;
  clearInterval(saatKimligi);
  if (kaydedici?.state !== 'inactive') kaydedici.stop();
}

function kayitBitti() {
  const tur = kaydedici.mimeType || parcalar[0]?.type || 'video/mp4';
  const blob = new Blob(parcalar, { type: tur });
  parcalar = [];
  $('kayit').setAttribute('aria-pressed', 'false');
  $('kayit').setAttribute('aria-label', 'Kaydı başlat');
  $('geri').hidden = false;
  $('cekimEkrani').classList.remove('kayitta');
  hazirBilgisi();

  const uzanti = tur.includes('mp4') ? 'mp4' : 'webm';
  const an = new Date();
  const ad = `solya-${String(an.getHours()).padStart(2, '0')}${String(an.getMinutes()).padStart(2, '0')}${String(an.getSeconds()).padStart(2, '0')}.${uzanti}`;
  videoDosya = new File([blob], ad, { type: uzanti === 'mp4' ? 'video/mp4' : 'video/webm' });
  if (videoAdresi) URL.revokeObjectURL(videoAdresi);
  videoAdresi = URL.createObjectURL(blob);
  $('izle').src = videoAdresi;
  $('ipucu').textContent = uzanti === 'webm'
    ? "Bu telefon WebM kaydetti. Instagram için önce MP4'e çevrilmeli."
    : navigator.canShare?.({ files: [videoDosya] }) ? "Açılan ekranda Videoyu Kaydet'e dokunun." : '';
  kaydedildi = false;
  ekranGoster('incelemeEkrani');
}

$('kayit').onclick = () => {
  if (cekiliyor) kaydiBitir();
  else if (akim) kaydiBaslat();
};

/* İnceleme ekranı */

$('kaydet').onclick = async () => {
  if (navigator.canShare?.({ files: [videoDosya] })) {
    try {
      await navigator.share({ files: [videoDosya], title: videoDosya.name });
      kaydedildi = true;
      $('ipucu').textContent = 'Paylaşım ekranı kapandı.';
    } catch (h) {
      if (h.name !== 'AbortError') $('ipucu').textContent = `Kaydedilemedi: ${h.message}`;
    }
    return;
  }
  const a = document.createElement('a');
  a.href = videoAdresi;
  a.download = videoDosya.name;
  a.click();
  kaydedildi = true;
  $('ipucu').textContent = 'Video indirilenlere kaydedildi.';
};

function cekimiBirak() {
  if (!kaydedildi && !confirm('Bu çekim kaydedilmedi. Silinsin mi?')) return false;
  $('izle').pause();
  $('izle').removeAttribute('src');
  $('izle').load();
  return true;
}

$('tekrar').onclick = async () => {
  if (!cekimiBirak()) return;
  ekranGoster('cekimEkrani');
  $('kaydirici').scrollTop = 0;
  ayarlariCiz();
  if (!akim) {
    try { await kameraAc(); hazirBilgisi(); } catch (h) { uyar(kameraHatasi(h)); }
  }
};

$('metneDon').onclick = () => {
  if (cekimiBirak()) metneDon();
};

/* Uygulama arka plana düşerse kamera kesilir: o ana kadarki çekim korunur */
document.addEventListener('visibilitychange', () => {
  if (document.hidden && cekiliyor) {
    kaydiBitir();
    return;
  }
  if (!document.hidden && akim) ekranAcikKalsin();
});

addEventListener('resize', () => {
  if (!$('cekimEkrani').hidden) yerlesimiKur();
});

metniGoster();
</script>
</body>
</html>
